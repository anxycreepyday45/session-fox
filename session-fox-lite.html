<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Session Fox Lite</title>
<style>
body{margin:0;background:#0c0c0e;color:#e8e6e1;font-family:system-ui,sans-serif;
display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:2rem}
.spin{width:28px;height:28px;border:3px solid #2a2a2e;border-top-color:#3dd68c;
border-radius:50%;animation:s .7s linear infinite;margin:0 auto 1rem}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><div id="t">Загрузка Session Fox Lite v1.3.0…</div></div>
<script>
(async () => {
  const base = "https://raw.githubusercontent.com/anxycreepyday45/session-fox/main/";
  try {
    const [a, b] = await Promise.all([
      fetch(base + "session-fox-lite.part1.txt?t=" + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }),
      fetch(base + "session-fox-lite.part2.txt?t=" + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }),
    ]);
    const html = a + b;
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById("t").textContent = "Ошибка: " + e + " — нужен интернет для первой загрузки частей.";
  }
})();
</script>
</body>
</html>
